  "Wear and damage must stay visible. Buyers of second-hand items need to judge condition.",
  "Listing photos are square.",
  "Clothing: prefer showing it worn (on a model) or as if worn (invisible mannequin) when the photo allows it. Otherwise a clean white background.",
  "Shoes, bags and accessories: white background with a soft shadow, or a simple, neutral scene.",
  "Keep it authentic. No glamorous scenes that make a used item look new.",
