# Relist listing rules.
# The agent reads this file at the start of every run. Change a rule here and
# rerun: the agent's choices change with no code change.

marketplace = "Relist, a second-hand fashion marketplace (think Vinted or Depop)"

# Hard limit on Photoroom calls per item. Every call costs money ($0.10 list price).
max_photoroom_calls_per_item = 4

# Styles the agent may use. Remove one to take it off the menu.
allowed_styles = [
  "white_shadow",
  "blurred_original",
  "ai_scene",
  "ghost_mannequin",
  "flat_lay",
  "on_model",
  "ironed",
]

rules = [
